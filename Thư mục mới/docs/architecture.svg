<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 545" width="1160" height="545" role="img" aria-label="Kiến trúc các tầng hệ thống Sora">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b1734"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#66e3fa"/><stop offset="1" stop-color="#d9a7ff"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#95aaca" stroke-width="1.6"/></marker>
</defs>
<rect width="1160" height="545" rx="25" fill="url(#bg)"/>
<text x="48" y="57" font-family="Arial,sans-serif" font-weight="bold" font-size="29" fill="#f1f5ff">SORA · kiến trúc tương tác và bảo vệ</text>
<text x="48" y="83" font-family="Arial,sans-serif" font-size="16" fill="#adb9d6">Thông tin thực tế và nội dung web được kiểm chứng trước khi cá tính hóa lời đáp</text>
<g stroke="#4b5872" fill="#212d47" stroke-width="1.5">
 <rect x="48" y="130" width="230" height="110" rx="14"/><rect x="332" y="130" width="248" height="110" rx="14"/><rect x="636" y="130" width="475" height="110" rx="14"/>
 <rect x="332" y="312" width="248" height="100" rx="14"/><rect x="636" y="312" width="475" height="100" rx="14"/><rect x="48" y="312" width="230" height="100" rx="14"/>
</g>
<g font-family="Arial,sans-serif" fill="#f5f6ff"><text x="68" y="164" font-size="21" font-weight="bold">Electron · RT</text><text x="68" y="191" font-size="15">Nhân vật, DIALOG, cờ vua</text><text x="68" y="215" font-size="15">Glitch và phản hồi</text>
<text x="352" y="164" font-size="21" font-weight="bold">Python Backend</text><text x="352" y="191" font-size="15">Điều phối, công cụ, phê duyệt</text><text x="352" y="215" font-size="15">Theo dõi trạng thái</text>
<text x="656" y="164" font-size="21" font-weight="bold">Nguồn dữ liệu</text><text x="656" y="191" font-size="15">Ollama · SQLite · UI Automation · Web/LAN</text><text x="656" y="215" font-size="15">Dữ liệu web không có quyền ra lệnh</text>
<text x="68" y="348" font-size="21" font-weight="bold">Tính cách Sora</text><text x="68" y="375" font-size="15">Engram · lối nói em–anh</text><text x="68" y="397" font-size="15">Biểu đạt, không bịa nguồn</text>
<text x="352" y="348" font-size="21" font-weight="bold">Kiểm chứng</text><text x="352" y="375" font-size="15">Cảnh báo · trạng thái thực</text><text x="352" y="397" font-size="15">Căn cứ · độ tin cậy</text>
<text x="656" y="348" font-size="21" font-weight="bold">Bảo trì &amp; bảo vệ</text><text x="656" y="375" font-size="15">SHA-256 · sao lưu · báo cáo tình trạng</text><text x="656" y="397" font-size="15">Chỉ dọn các mục Sora đã xác định</text></g>
<g stroke="#9eb5d1" stroke-width="2.5" marker-end="url(#arrow)" fill="none"><path d="M280 185H325"/><path d="M582 185H630"/><path d="M452 246V301"/><path d="M352 363H288"/><path d="M868 247V300"/></g>
<rect x="48" y="466" width="1064" height="42" rx="10" fill="#283752"/><rect x="48" y="466" width="5" height="42" rx="2" fill="url(#accent)"/>
<text x="69" y="493" font-size="16" font-family="Arial,sans-serif" fill="#e8eeff">Nguyên tắc: tra cứu đọc-only → phân tích nguồn → tạo nội dung có căn cứ → diễn đạt bằng tính cách Sora</text>
</svg>
