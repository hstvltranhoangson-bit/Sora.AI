<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sora</title>
  <link rel="stylesheet" href="chess.css">
  <link rel="stylesheet" href="../hub/hub.css">
</head>
<body>
  <!-- Viền ngoài đứng độc lập, không bị clip-path của cửa sổ cắt mất nét chéo. -->
  <svg class="cut-corner-outline game-outline" data-cut-outline="game" aria-hidden="true" focusable="false"><path></path></svg>
  <div class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="avatar-mini"><img src="../../../assets/icons/tray.png" alt="" aria-hidden="true"></span><span class="brand-title">SORA<small>8 TRÒ</small></span></div>
      <button type="button" class="game-rail-arrow" id="game-rail-left" aria-label="Cuộn trò chơi sang trái">‹</button>
      <nav class="game-rail" id="game-rail" data-gamehub-version="6" aria-label="Thanh chọn trò chơi, kéo sang trái hoặc phải">
        <button type="button" class="tab active" id="game-tab-chess" data-game="chess" aria-pressed="true">♟ CỜ VUA</button>
        <button type="button" class="tab tab-tictactoe" id="game-tab-tictactoe" data-game="tictactoe" aria-pressed="false" title="Chuyển sang Tic Tac Toe">
          <svg class="ttt-tab-icon" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M10 2v24M18 2v24M2 10h24M2 18h24"/><path d="m3 3 5 5m0-5L3 8m12 12 6 6m0-6-6 6"/><circle cx="22" cy="6" r="2.5"/>
          </svg>
          TIC TAC TOE
        </button>
        <button type="button" class="tab" data-game="connect4" aria-pressed="false">⬤ CỜ NỐI 4</button>
        <button type="button" class="tab" data-game="gomoku" aria-pressed="false">✕ CỜ CARO</button>
        <button type="button" class="tab" data-game="word" aria-pressed="false">◈ ĐOÁN TỪ</button>
        <button type="button" class="tab" data-game="reversi" aria-pressed="false">◉ CỜ LẬT</button>
        <button type="button" class="tab" data-game="battleship" aria-pressed="false">⚓ BẮN TÀU</button>
        <button type="button" class="tab" data-game="detective" aria-pressed="false">⌕ THÁM TỬ</button>
      </nav>
      <button type="button" class="game-rail-arrow" id="game-rail-right" aria-label="Cuộn trò chơi sang phải">›</button>
      <span class="offline-chip" id="network-status" title="Trạng thái kết nối mạng, không phải trạng thái Ollama"><i></i><span>OFFLINE</span></span>
      <div class="window-controls" aria-label="Điều khiển cửa sổ">
        <button type="button" data-window-action="minimize" aria-label="Thu nhỏ cửa sổ" title="Thu nhỏ">−</button>
        <button type="button" data-window-action="maximize" aria-label="Khôi phục kích thước chuẩn của cửa sổ" title="Kích thước chuẩn">□</button>
        <button type="button" data-window-action="close" aria-label="Đóng cửa sổ" title="Đóng">×</button>
      </div>
    </header>
    <main class="arena">
      <section class="board-area" id="board-area" aria-label="Bàn cờ vua">
        <div class="board-head"><span>Line <small id="player-piece">QUÂN TRẮNG</small></span><span class="vs">VS</span><span>Sora <small id="sora-piece">QUÂN ĐỎ</small></span></div>
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Bàn cờ vua 8 x 8"></div>
          <div id="tic-board" class="tic-board" role="grid" aria-label="Tic Tac Toe 3 x 3" hidden></div>
          <div id="hub-board" class="hub-board" role="region" aria-label="Trò chơi cùng Sora" hidden></div>
        </div>
        <div class="board-footer"><span id="board-instructions">CHỌN QUÂN → CHỌN Ô ĐẾN</span><span id="move-count">LƯỢT 01</span></div>
      </section>
      <aside class="sidebar">
        <div class="character-card">
          <img src="../../../assets/sora/sora-face.png" alt="Chân dung Sora">
          <div><strong>Sora</strong></div>
        </div>
        <div class="status" id="status" aria-live="polite"><span class="led"></span><b>ĐẾN LƯỢT Line</b><small>(Trắng)</small></div>
        <section class="dialogue" aria-label="Trò chuyện với Sora">
          <div class="dialogue-head"><span>DIALOG</span></div>
          <div class="terminal-wrap">
            <div class="terminal-log">
              <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Lịch sử hội thoại"></div>
            </div>
          </div>
          <div class="chat-form-frame">
            <form id="chat-form" class="chat-form" autocomplete="off">
              <span class="terminal-prompt" aria-hidden="true">&gt;_</span>
              <input id="chat-input" type="text" maxlength="3000" aria-label="Nhập lời nhắn cho Sora" placeholder="" spellcheck="false">
              <button type="submit" title="Gửi lời nhắn" aria-label="Gửi lời nhắn">↵</button>
            </form>
          </div>
        </section>
        <div class="actions">
          <button id="new-game" class="action-primary">VÁN MỚI</button>
        </div>
        <label class="voice-toggle"><input type="checkbox" id="voice-toggle"><span>VOICE</span></label>
        <p class="score" id="score">Line 0 thắng · Sora 0 thắng · 0 hòa</p>
      </aside>
    </main>
  </div>
  <script type="module" src="chess.js"></script>
</body>
</html>
