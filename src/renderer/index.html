<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' sora: blob:; connect-src 'self' sora:">
  <title>Sora</title>
  <link rel="stylesheet" href="styles/sora.css">
</head>
<body>
  <div id="sora" class="sora">
    <canvas id="sprite" class="sora__sprite" aria-label="Sora"></canvas>
    <img id="seat-sprite" class="sora__seat" src="../../assets/sora/sora-seated.png"
         alt="" aria-hidden="true">
    <canvas id="seat-effects" class="sora__seat" aria-hidden="true"></canvas>
    <canvas id="sora-perch-60" class="sora__seat" aria-hidden="true"></canvas> <!-- SORA-FUSION -->
    <img id="lie-sprite" class="sora__seat" src="../../assets/sora/sora-lying.png" alt="" aria-hidden="true">
    <canvas id="lie-effects" class="sora__seat" aria-hidden="true"></canvas>
  </div>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <canvas id="chip" class="chip" hidden aria-label="Sora thu nhỏ"></canvas>
  <canvas id="mask" class="chip" hidden aria-label="Sora đang ngủ"></canvas>

  <aside id="panel" class="panel" data-kind="info" hidden aria-live="polite">
    <div class="panel__frame">
      <div class="panel__plate">
        <figure class="panel__face" aria-hidden="true">
          <img src="../../assets/sora/sora-face.png" alt="">
        </figure>
        <div class="panel__body">
          <header class="panel__meta">
            <span class="panel__who">Sora</span>
            <span class="panel__tag"></span>
            <span class="panel__state"></span>
          </header>
          <p class="panel__line"></p>
          <p class="panel__quote" hidden></p>
          <div class="panel__progress" hidden><span class="panel__bar"></span></div>
          <div class="panel__reply" hidden></div>
          <section class="panel__report" hidden></section>
          <p class="panel__summary" hidden></p>
          <ol class="panel__log" hidden></ol>
          <div class="panel__actions" hidden></div>
          <form class="panel__chat" hidden autocomplete="off">
            <input class="panel__input" type="text" maxlength="500" spellcheck="true" lang="vi" aria-label="Nhắn tin cho Sora">
            <button class="panel__action is-primary panel__send" type="submit"></button>
            <button class="panel__action panel__close" type="button" aria-label="Đóng trò chuyện">✕</button>
          </form>
          <p class="panel__note" hidden></p>
        </div>
      </div>
      <div class="panel__tail" aria-hidden="true"></div>
    </div>
  </aside>

  <div id="ticker" class="ticker" hidden>
    <div class="ticker__plate">
      <span class="ticker__dot" aria-hidden="true"></span>
      <span class="ticker__verb"></span>
      <span class="ticker__target"></span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
