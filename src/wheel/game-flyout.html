<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sora — Trò chơi</title>
  <link rel="stylesheet" href="wheel.css">
  <link rel="stylesheet" href="game-flyout.css">
</head>
<body>
<main class="wheel-stage" id="wheel-stage" data-submenu="games">
  <div class="game-submenu" id="game-submenu" role="menu" aria-label="Chọn trò chơi" aria-hidden="false">
    <svg class="game-submenu__drawing" viewBox="0 0 332 332" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="game-paint" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#352449" stop-opacity=".98"/>
          <stop offset="1" stop-color="#141121" stop-opacity=".98"/>
        </linearGradient>
      </defs>
      <g id="game-segments"></g>
      <path class="game-submenu__arc" id="game-arc"></path>
    </svg>
    <button class="game-submenu__choice" data-game="chess" type="button" role="menuitem" aria-label="Mở Cờ vua">
      <span class="game-submenu__symbol game-submenu__symbol--chess" aria-hidden="true">♞</span>
      <span class="game-submenu__label">CỜ VUA</span>
    </button>
    <button class="game-submenu__choice" data-game="tictactoe" type="button" role="menuitem" aria-label="Mở Tic Tac Toe">
      <svg class="game-submenu__symbol game-submenu__symbol--tic" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M11 3v26M21 3v26M3 11h26M3 21h26"/>
        <path d="M5 5l4 4m0-4L5 9M23 24l4 4m0-4l-4 4"/>
        <circle cx="16" cy="16" r="3"/>
      </svg>
      <span class="game-submenu__label">TIC TAC TOE</span>
    </button>
  </div>
</main>
<script src="game-flyout.js"></script>
</body>
</html>
